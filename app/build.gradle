plugins { id 'com.android.application' }
android {
    namespace 'cn.focusledger'
    compileSdk 35
    defaultConfig {
        // Stable installation identity: future releases must retain this ID and the V2 release certificate.
        applicationId 'cn.goff.shiben'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '3.1'
        testInstrumentationRunner 'cn.focusledger.LedgerInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2" } }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
