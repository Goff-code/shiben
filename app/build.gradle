plugins { id 'com.android.application' }
android {
    namespace 'cn.focusledger'
    compileSdk 35
    defaultConfig {
        // A separate app keeps any installed 1.0.0 app and its private data intact.
        // The old release signing key is unavailable, so this is not an in-place update.
        applicationId 'cn.goff.shiben'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'cn.focusledger.LedgerInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
