plugins { id 'com.android.application' }
android {
    namespace 'cn.focusledger'
    compileSdk 35
    defaultConfig {
        // Stable installation identity: future releases must retain this ID and the V2 release certificate.
        applicationId 'cn.goff.shiben'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '3.0'
        testInstrumentationRunner 'cn.focusledger.LedgerInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
