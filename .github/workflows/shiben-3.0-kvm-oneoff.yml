name: Shiben 3.0 reviewed one-off KVM QA

# Offline candidate. Do not push until the reviewer verifies free compute AND artifact
# allowance/overage blocking, reviews the exact commit, and authorizes that push.
# No main edit, schedule, pull_request, workflow_run, repository_dispatch or matrix.
on:
  push:
    branches: ['qa/shiben-3.0-kvm-20261010-8fc0e7']

permissions:
  contents: read

concurrency:
  group: shiben-3.0-reviewed-kvm
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Goff-code/shiben' &&
      github.ref == 'refs/heads/qa/shiben-3.0-kvm-20261010-8fc0e7' &&
      github.event.head_commit.message == 'qa: validate Shiben 3.0 once [20261010-8fc0e7]' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QA_TOOLS: ${{ runner.temp }}/shiben-tools
      QA_WORK: ${{ runner.temp }}/shiben-work
      QA_OUT: ${{ runner.temp }}/shiben-evidence
      ANDROID_AVD_HOME: ${{ runner.temp }}/shiben-avd
      ANDROID_USER_HOME: ${{ runner.temp }}/shiben-android-user
      GRADLE_USER_HOME: ${{ runner.temp }}/shiben-gradle
    steps:
      - name: Read the exact reviewed test commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official GitHub
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Pinned 2.0.2 ancestor is required for genuine upgrade.
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify gate, runner, and KVM before tool downloads
        id: gate
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_OUT" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          python3 scripts/actions/verify-gate.py | tee "$QA_OUT/gate.json"
          test -c /dev/kvm
          # No chmod, ACL, sudo, group or security changes are automated here.
          # Missing existing KVM access fails before expensive downloads.
          test -r /dev/kvm && test -w /dev/kvm
          { uname -a; nproc; free -m; df -h .; ls -l /dev/kvm; printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"; } > "$QA_OUT/runner.txt"
      - name: Restore fixed, previously approved official tools
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 390s python3 scripts/actions/install-tools.py "$QA_TOOLS" "$QA_OUT"
          echo "JAVA_HOME=$QA_TOOLS/jdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$QA_TOOLS/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$QA_TOOLS/sdk" >> "$GITHUB_ENV"
          echo "$QA_TOOLS/jdk/bin" >> "$GITHUB_PATH"
          echo "$QA_TOOLS/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Build fixed genuine code5 and code7 with one ephemeral debug key
        timeout-minutes: 7
        shell: bash
        run: timeout --signal=TERM --kill-after=15s 390s bash scripts/actions/build.sh
      - name: Run one API35 KVM instance and strict native suites
        timeout-minutes: 18
        shell: bash
        run: timeout --signal=TERM --kill-after=20s 1020s bash scripts/actions/run-native.sh
      - name: Prepare bounded synthetic test evidence, even on failure
        id: evidence
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: python3 scripts/actions/prepare-artifact.py "$QA_OUT" "$RUNNER_TEMP/shiben-upload"
      - name: Preserve approved bounded evidence for review
        if: ${{ always() && steps.gate.outcome == 'success' && steps.evidence.outcome == 'success' && steps.evidence.outputs.ready == 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, official GitHub
        with:
          name: shiben-3.0-api35-${{ github.run_id }}
          path: ${{ runner.temp }}/shiben-upload/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
